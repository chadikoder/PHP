/* Inline critical CSS — kept tiny so first paint doesn't wait for the full sheet to arrive. */
:root{--bg:#0a0a0b;--surface:#18181b;--surface-2:#27272a;--text:#fafafa;--text-2:#a1a1aa;--border:rgba(255,255,255,.07);--accent:#818cf8;--header-h:60px}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}

.skip-link{position:absolute;left:-9999px}
.layout{max-width:980px;margin:0 auto;min-height:calc(100vh - var(--header-h))}

.sidebar,.drawer-backdrop,.modal-backdrop,.scroll-progress,.toast,.jump-top,.shortcuts-hint,.pomo-panel{position:fixed}

.boot-skel{padding:32px 6px;display:flex;flex-direction:column;gap:18px;max-width:1100px}
.boot-skel>div{border-radius:10px;background:linear-gradient(90deg,var(--surface-2) 0%,var(--surface) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:bs 1.2s ease-in-out infinite}
.boot-skel-title{width:55%;height:36px !important}
.boot-skel-sub{width:75%;height:14px}
.boot-skel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:8px;background:none !important;animation:none !important;height:auto !important}
.boot-skel-grid>div{height:104px;border-radius:14px}
@keyframes bs{0%,100%{background-position:200% 0}50%{background-position:-200% 0}}
html.has-active .welcome{display:none}
</style>
